<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Aquatic Rejuvenation Chamber) -->
    <linearGradient id="chamber_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e17" />
      <stop offset="50%" stop-color="#071b26" />
      <stop offset="100%" stop-color="#05121c" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyan_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="hud_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="150" rx="10" fill="url(#chamber_bg)" stroke="#0e3d54" stroke-width="1.2" />

  <!-- Background Grid -->
  <rect width="850" height="150" rx="10" fill="url(#hud_grid)" />

  <!-- Ambient Bubbles (Liquid Suspension Effect) -->
  <circle cx="95" cy="115" r="3" fill="#22d3ee" fill-opacity="0.25" />
  <circle cx="102" cy="70" r="1.5" fill="#22d3ee" fill-opacity="0.35" />
  <circle cx="140" cy="40" r="2.5" fill="#00e5ff" fill-opacity="0.2" />
  <circle cx="720" cy="100" r="2" fill="#22d3ee" fill-opacity="0.3" />
  <circle cx="745" cy="45" r="3.5" fill="#00e5ff" fill-opacity="0.2" />
  <circle cx="760" cy="75" r="1.5" fill="#22d3ee" fill-opacity="0.35" />
  <circle cx="390" cy="130" r="2" fill="#22d3ee" fill-opacity="0.25" />
  <circle cx="470" cy="20" r="2" fill="#00e5ff" fill-opacity="0.2" />

  <!-- Sci-fi Corner Bracket Accents -->
  <path d="M 20 32 L 20 20 L 32 20" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 830 32 L 830 20 L 818 20" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 20 118 L 20 130 L 32 130" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M 830 118 L 830 130 L 818 130" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Top Status Badge -->
  <g transform="translate(425, 28)">
    <rect x="-140" y="-10" width="280" height="20" rx="4" fill="#031b26" stroke="#0e5a7a" stroke-width="0.8" />
    <circle cx="-120" cy="0" r="3.5" fill="#00e5ff" filter="url(#soft_glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="-105" y="3.5" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#22d3ee" letter-spacing="2">CHAMBER://0x0 • REGEN_ACTIVE</text>
  </g>

  <!-- Main Monogram -->
  <text x="425" y="78" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="34" font-weight="800" fill="#f0f9ff" letter-spacing="5" filter="url(#cyan_glow)">0xf-0</text>

  <!-- Horizontal Scan/Vitals Axis -->
  <line x1="160" y1="95" x2="350" y2="95" stroke="#0e4b66" stroke-width="1" />
  <polygon points="350,93 355,95 350,97" fill="#22d3ee" />
  
  <line x1="690" y1="95" x2="500" y2="95" stroke="#0e4b66" stroke-width="1" />
  <polygon points="500,93 495,95 500,97" fill="#22d3ee" />
  
  <circle cx="425" cy="95" r="2.5" fill="#00e5ff" filter="url(#soft_glow)" />

  <!-- Subtitle -->
  <text x="425" y="112" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="3">LOW-LEVEL REVERSE ENGINEERING • WINDOWS INTERNALS</text>

  <!-- Micro Diagnostics Footer -->
  <text x="425" y="132" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="400" fill="#588599" letter-spacing="1.5">EIP: 0x00000000 • PE_STATE: COMMITTED • CALLSTACK: ANCHORED</text>
</svg>
